[package]
name = "cruor-framework"
version = "0.1.0"
edition = "2024"
description = "The tool of the Cruor framework: writes the stylesheet of Cruor's web fonts, their manifest, and a release"
repository = "https://github.com/crussella0129/cruor-framework"
# The terms of the code. The fonts have terms of their own: fonts/OFL.txt.
license = "MIT OR Apache-2.0"
publish = false

# This crate is its own workspace root, so a manifest in a parent directory is
# never consulted.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.2"
zip = { version = "9.8.2", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
